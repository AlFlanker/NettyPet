plugins { id 'maven-publish' }

// Подключаемая библиотека Servlet async + Jetty HttpClient, без Boot application.
dependencies {
    api platform('org.eclipse.jetty:jetty-bom:12.1.12')
    api 'org.eclipse.jetty:jetty-client'
    compileOnlyApi 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    implementation('org.eclipse.jetty.ee11:jetty-ee11-servlet:12.1.12') {
        // Servlet API предоставляет принимающий контейнер приложения.
        exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
    }

    testImplementation 'jakarta.servlet:jakarta.servlet-api:6.1.0'
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

java { withSourcesJar() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Jetty Proxy'
                description = 'Embeddable Servlet async proxy and bounded resource fetch over Jetty HttpClient'
                // compileOnlyApi is exported to Gradle API consumers, but its
                // default Maven mapping is compile/runtime. A Servlet container
                // supplies this API; a Maven dependency must not package it.
                withXml {
                    def servletApi = asNode().dependencies.dependency.findAll {
                        it.groupId.text() == 'jakarta.servlet' && it.artifactId.text() == 'jakarta.servlet-api'
                    }
                    if (servletApi.size() != 1)
                        throw new GradleException('Expected one provided Servlet API dependency in the library POM')
                    servletApi.first().scope[0].setValue('provided')
                }
            }
        }
    }
    repositories {
        maven {
            name = 'verification'
            url = layout.buildDirectory.dir('repository')
        }
    }
}
