plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation enforcedPlatform('io.netty:netty-bom:4.2.19.Final')
    implementation project(':proxy')
    implementation project(':command-support')
    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    implementation 'org.springframework.boot:spring-boot-starter-jetty'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.16.7'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Проверяем аварийный запуск настоящего фасада, управляя его внутренним EventLoop в тесте.
    testImplementation 'io.netty:netty-transport'
}

tasks.named('bootJar') { archiveFileName = 'app-1.0.0.jar' }
tasks.named('jar') { enabled = false }
