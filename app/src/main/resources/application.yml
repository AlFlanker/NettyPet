spring:
  jmx:
    # Включает локальный MBeanServer; удалённый JMX-коннектор и HTTP-мониторинг не создаются.
    enabled: true
    unique-names: true
server:
  port: 8080
  max-http-request-header-size: 16KB
  compression:
    enabled: false
# Настройки потоковой передачи, пулов upstream-соединений и лимитов одного обмена.
# Переопределение при запуске: --proxy.io-threads=10, --proxy.connect-timeout=500ms.
# Таймауты задаются с единицами времени (ms, s, m); допустимо 1..2147483647 мс.
proxy:
  # Базовый HTTP(S)-адрес upstream; переменная PROXY_UPSTREAM переопределяет его.
  # Необязательный путь (/base) добавляется перед путём запроса. Query, fragment и user info запрещены.
  upstream: ${PROXY_UPSTREAM:http://localhost:9001}

  # Число Netty I/O-потоков для соединений с upstream; минимум 1.
  # Это не число потоков Jetty и не лимит запросов в секунду.
  io-threads: 2

  # Общий предел принятых обменов: подготовка, ожидание пула, передача и освобождение ресурсов.
  # При заполнении — 503. Независим от дополнительного лимита proxy-command.max-concurrent.
  max-concurrent: 256

  # Максимум соединений в одном пуле (origin + I/O-поток); минимум 1.
  # Origin — схема, host и порт. Предел на origin: это значение × io-threads.
  connections-per-origin-per-loop: 64

  # Максимум запросов, ожидающих свободного соединения в каждом таком пуле; минимум 1.
  # Переполнение очереди — 503; время ожидания ограничено acquire-timeout.
  pending-acquires-per-pool: 64

  # Размер порции тела запроса, буфера чтения upstream и переносимого буфера записи клиенту, в байтах.
  # Диапазон 1024..65536. Чтение не ждёт заполнения всей порции; тело передаётся потоком.
  chunk-bytes: 65536

  # Защитный предел полезных байтов в очереди одного ответа; минимум 4 × chunk-bytes.
  # Не ограничивает полный размер ответа и не включает память Netty/TLS/Jetty и сокетов.
  response-buffer-bytes: 262144

  # Отдельный таймаут TCP connect, TLS handshake и каждого DNS-запроса.
  # Это не общий срок всех этапов подключения; весь обмен ограничен exchange-timeout.
  connect-timeout: 3s

  # Сколько ждать свободного слота соединения в пуле; истечение ожидания — 503.
  acquire-timeout: 5s

  # Ожидание финальных заголовков upstream после успешной отправки всего запроса.
  # Ответы 1xx не завершают ожидание; после финальных заголовков этот таймер выключен.
  response-headers-timeout: 10s

  # Абсолютный срок async-обмена: очередь I/O-потока, получение соединения и передача тела.
  # Трафик его не продлевает. Синхронные processors до создания обмена в этот срок не входят.
  exchange-timeout: 60s

  # Срок простоя свободного upstream-соединения в пуле до его закрытия.
  # Не ограничивает длительность активной передачи.
  idle-connection-timeout: 30s

  # До 32 дополнительных разрешённых origin для смены назначения процессорами, например:
  # allowed-origins: ["https://alternate.example:443"]
  # Origin основного upstream разрешён автоматически; [] оставляет доступ к нему.
  # Сравниваются схема, host и порт, а не path/query или IP-адрес после DNS.
  allowed-origins: []

# Приложение настраивает политику команд; транспорт прокси от неё не зависит.
proxy-command:
  timeout: 30s
  max-concurrent: 128
  failure-rate-threshold: 50
  sliding-window-size: 20
  minimum-number-of-calls: 10
  wait-duration-in-open-state: 10s
  permitted-calls-in-half-open-state: 3
