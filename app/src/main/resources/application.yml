spring:
  jmx:
    # Включает локальный MBeanServer; удалённый JMX-коннектор и HTTP-мониторинг не создаются.
    enabled: true
    unique-names: true
server:
  port: 8080
  max-http-request-header-size: 16KB
  compression:
    enabled: false
proxy:
  upstream: ${PROXY_UPSTREAM:http://localhost:9000}
  io-threads: 2
  max-concurrent: 256
  connections-per-origin-per-loop: 64
  pending-acquires-per-pool: 64
  chunk-bytes: 65536
  response-buffer-bytes: 262144
  connect-timeout: 3s
  acquire-timeout: 5s
  response-headers-timeout: 10s
  exchange-timeout: 60s
  idle-connection-timeout: 30s
  allowed-origins: []

# Приложение настраивает политику команд; транспорт прокси от неё не зависит.
proxy-command:
  timeout: 30s
  max-concurrent: 128
  failure-rate-threshold: 50
  sliding-window-size: 20
  minimum-number-of-calls: 10
  wait-duration-in-open-state: 10s
  permitted-calls-in-half-open-state: 3
